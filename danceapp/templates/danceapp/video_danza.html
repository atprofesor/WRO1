{% extends 'danceapp/base.html' %}
{% load static %}

{% block title %}Video Danza - Joropo{% endblock %}

{% block content %}
<div id="video-container">
    <video id="joropo-video" width="100%" height="100%" autoplay playsinline>
        <source src="{% static 'danceapp/videos/video_joropo.mp4' %}" type="video/mp4">
        Tu navegador no soporta la reproducción de videos.
    </video>
</div>

<script>
    (function() {
        'use strict';
        
        const video = document.getElementById('joropo-video');
        let fullScreenActivated = false;
        
        // Función para entrar en full screen
        function entrarFullScreen(elemento) {
            if (!fullScreenActivated) {
                fullScreenActivated = true;
                if (elemento.requestFullscreen) {
                    elemento.requestFullscreen();
                } else if (elemento.webkitRequestFullscreen) {
                    elemento.webkitRequestFullscreen();
                } else if (elemento.msRequestFullscreen) {
                    elemento.msRequestFullscreen();
                }
            }
        }
        
        // Función para salir de full screen
        function salirFullScreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }
        
        // Función para volver a la página anterior
        function volverAtras() {
            const isFullScreen = document.fullscreenElement || 
                                document.webkitFullscreenElement || 
                                document.msFullscreenElement;
            
            if (isFullScreen) {
                salirFullScreen();
                setTimeout(() => {
                    window.history.back();
                }, 300);
            } else {
                window.history.back();
            }
        }
        
        // ============================================
        // SISTEMA DE VOZ MEJORADO PARA VIDEO_DANZA
        // ============================================
        
        // Variable para controlar si ya configuramos el interceptor
        if (window.videoVoiceInterceptorActive) {
            return;
        }
        
        window.videoVoiceInterceptorActive = true;
        
        // Función para mostrar feedback en el status (versión simplificada para video)
        function showVoiceFeedback(message) {
            const statusDiv = document.getElementById('voice-status');
            if (statusDiv) {
                const originalText = statusDiv.textContent;
                statusDiv.textContent = message;
                statusDiv.style.backgroundColor = '#ff9800';
                setTimeout(() => {
                    if (statusDiv && statusDiv.textContent === message) {
                        statusDiv.textContent = originalText;
                        statusDiv.style.backgroundColor = '';
                    }
                }, 2000);
            }
        }
        
        // Procesar comandos de voz para video_danza
        window.processVideoCommand = function(command) {
            console.log("Video_Danza procesando comando:", command);
            
            // Comandos para VOLVER/ATRÁS (salir del video)
            if (command.includes('volver') || command.includes('atrás') || command.includes('regresar')) {
                showVoiceFeedback('🎤 Comando "Volver" detectado - Saliendo del video');
                volverAtras();
                return true;
            }
            // Para el video, el comando "siguiente" no aplica, pero lo registramos
            else if (command.includes('siguiente') || command.includes('adelante') || command.includes('continuar')) {
                showVoiceFeedback('🎤 Comando "Siguiente" detectado - El video debe terminar primero');
                // Opcional: reproducir un sonido o mensaje indicando que no es posible
                return true;
            }
            return false;
        };
        
        // Interceptar el sistema de voz global
        if (typeof window.parseCommand === 'function') {
            const originalParseCommandFn = window.parseCommand;
            window.parseCommand = function(text) {
                // Primero intentar procesar en video_danza
                if (window.processVideoCommand && window.processVideoCommand(text)) {
                    return null;
                }
                // Si no, usar la original
                return originalParseCommandFn(text);
            };
            console.log("Video_Danza: Interceptor de comandos de voz activado");
        } else {
            // Esperar a que cargue voice.js
            const checkVoiceJs = setInterval(() => {
                if (typeof window.parseCommand === 'function') {
                    clearInterval(checkVoiceJs);
                    const originalParseCommandFn = window.parseCommand;
                    window.parseCommand = function(text) {
                        if (window.processVideoCommand && window.processVideoCommand(text)) {
                            return null;
                        }
                        return originalParseCommandFn(text);
                    };
                    console.log("Video_Danza: Interceptor de comandos de voz activado (tardío)");
                }
            }, 100);
            
            setTimeout(() => {
                clearInterval(checkVoiceJs);
            }, 5000);
        }
        
        // ============================================
        // REPRODUCCIÓN DE VIDEO Y FULLSCREEN
        // ============================================
        
        // Mostrar un mensaje inicial para que el usuario interactúe
        function mostrarBienvenida() {
            const container = document.getElementById('video-container');
            
            if (document.getElementById('video-overlay')) return;
            
            const overlay = document.createElement('div');
            overlay.id = 'video-overlay';
            overlay.innerHTML = `
                <div class="overlay-content">
                    <h2>🎭 Joropo - Danza Tradicional</h2>
                    <p>Haz clic en el botón para disfrutar del video con sonido</p>
                    <p style="font-size: 0.9em; margin-top: 10px;">🎵 La experiencia incluye audio tradicional</p>
                    <button id="play-fullscreen-btn">🎬 Iniciar con Sonido</button>
                </div>
            `;
            container.appendChild(overlay);
            
            const btn = document.getElementById('play-fullscreen-btn');
            btn.addEventListener('click', function() {
                video.muted = false;
                video.volume = 1.0;
                
                const playPromise = video.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('Video reproduciéndose con sonido');
                        entrarFullScreen(video);
                        overlay.remove();
                    }).catch(error => {
                        console.log('Error al reproducir:', error);
                        alert('Haz clic en el video para activar el sonido');
                        overlay.remove();
                    });
                }
            });
        }
        
        // Intentar reproducción automática
        video.muted = false;
        video.volume = 1.0;
        
        const playPromise = video.play();
        
        if (playPromise !== undefined) {
            playPromise.then(() => {
                console.log('Autoplay con sonido exitoso');
                setTimeout(() => {
                    entrarFullScreen(video);
                }, 100);
            }).catch(error => {
                console.log('Autoplay con sonido bloqueado, mostrando botón de inicio');
                mostrarBienvenida();
            });
        }
        
        // Manejar salida de full screen
        function handleFullScreenChange() {
            const isFullScreen = document.fullscreenElement || 
                                document.webkitFullscreenElement || 
                                document.msFullscreenElement;
            
            if (!isFullScreen && fullScreenActivated) {
                setTimeout(() => {
                    window.history.back();
                }, 100);
            }
        }
        
        document.addEventListener('fullscreenchange', handleFullScreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullScreenChange);
        document.addEventListener('msfullscreenchange', handleFullScreenChange);
        
        // Cuando el video termina, regresar
        video.addEventListener('ended', function() {
            volverAtras();
        });
        
        // Si el usuario presiona ESC, regresar
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                setTimeout(() => {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                        window.history.back();
                    }
                }, 100);
            }
        });
        
        // Activar sonido si el usuario hace clic en el video
        video.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
            }
        });
        
        console.log("Video_Danza: Sistema de voz listo - Comandos: Volver/Atrás/Regresar para salir");
    })();
</script>

<style>
    /* Estilos específicos para la página de video */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        overflow: hidden;
        background-color: #000;
        margin: 0;
        padding: 0;
    }
    
    #video-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        z-index: 9999;
    }
    
    #joropo-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background-color: #000;
    }
    
    #video-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.95);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        backdrop-filter: blur(5px);
    }
    
    .overlay-content {
        text-align: center;
        color: white;
        font-family: Arial, sans-serif;
        padding: 30px;
        background: rgba(0,0,0,0.8);
        border-radius: 15px;
        border: 2px solid #ff6b35;
        max-width: 80%;
    }
    
    .overlay-content h2 {
        font-size: 1.8rem;
        margin-bottom: 20px;
        color: #ff6b35;
    }
    
    .overlay-content p {
        font-size: 1.2rem;
        margin-bottom: 20px;
    }
    
    #play-fullscreen-btn {
        padding: 15px 40px;
        font-size: 1.3rem;
        background-color: #ff6b35;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.2s;
        margin-top: 10px;
    }
    
    #play-fullscreen-btn:hover {
        background-color: #ff5722;
        transform: scale(1.05);
    }
    
    /* Ocultar header y footer en esta página */
    .site-header,
    .site-footer {
        display: none !important;
    }
    
    .page-content {
        padding: 0 !important;
        margin: 0 !important;
    }
</style>
{% endblock %}
