{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPuppets - !Luces, cámara, acción! Y que empiece el show</title>
    <link rel="stylesheet" href="{% static 'danceapp/css/styles.css' %}">
</head>
<body data-dance="{{ dance.slug|default:'' }}" data-stage="{{ stage|default:'' }}">
    <header class="site-header">
        <div class="header-content">
            <h1>CYBERPUPPETS</h1>
            <p>!Vive, experimenta y aprende con el teatro de tradición en movimiento!</p>
        </div>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div id="voice-status" class="voice-status">Iniciando reconocimiento de voz...</div>
    </footer>

    <script src="{% static 'danceapp/js/voice.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof initVoiceRecognition === 'function') {
                initVoiceRecognition();
            }
        });
    </script>
</body>
</html>
