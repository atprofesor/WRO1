{% extends 'danceapp/base.html' %}
{% load static %}

{% block content %}
<style>
    /* CONEXIÓN ULTRA ESTRICTA SINGLE VIEWPORT
       Convertimos toda la sección en un contenedor Flex vertical de tamaño fijo e inamovible
    */
    .dance-gallery-section {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: space-between !important; /* Distribuye el espacio exacto entre Título, Carrusel y Botones */
        width: 100% !important;
        height: 75vh !important; /* Altura máxima ideal para absorber menús superiores de base.html sin desbordar */
        max-height: 75vh !important;
        margin: 0 auto !important;
        padding: 10px 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important; /* Bloquea cualquier intento de scroll accidental */
    }

    /* Título optimizado para Dashboard */
    .gallery-title {
        width: 100% !important;
        text-align: center !important;
        margin: 0 !important;
    }
    .gallery-title h2 {
        text-transform: uppercase; 
        font-weight: 700; 
        margin: 0;
        font-size: 1.6rem !important;
    }

    /* Visor del Carrusel calibrado para Single Viewport */
    .carousel-dashboard-viewer {
        width: 100%;
        max-width: 850px; /* Ancho idóneo para conservar la proporción visual en pantallas horizontales */
        height: 52vh !important; /* Asignación exacta del espacio mayoritario de pantalla */
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
        background: #f8fafc;
    }

    /* Cinta interna del carrusel */
    .carousel-track-animation {
        display: flex;
        width: 400%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        animation: dashboardSlider 16s infinite ease-in-out;
    }

    .carousel-slide-item {
        width: 25%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    .carousel-slide-item img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* Renderiza la foto completa de forma impecable */
        display: block;
        background-color: #f1f5f9;
    }

    /* Botonera integrada al flujo del Dashboard de Impacto Directo */
    .page-actions-dashboard {
        display: flex !important;
        justify-content: center !important;
        gap: 16px !important;
        width: 100% !important;
        margin-top: 10px !important;
    }

    /* Animación cíclica CSS para las 4 imágenes */
    @keyframes dashboardSlider {
        0%, 20% { transform: translateX(0%); }
        22.5% { transform: translateX(-25%); }
        25%, 45% { transform: translateX(-25%); }
        47.5% { transform: translateX(-50%); }
        50%, 70% { transform: translateX(-50%); }
        72.5% { transform: translateX(-75%); }
        75%, 95% { transform: translateX(-75%); }
        100% { transform: translateX(0%); }
    }

    /* Ajustes dinámicos para pantallas compactas */
    @media (max-height: 650px) or (max-width: 600px) {
        .gallery-title h2 { font-size: 1.3rem !important; }
        .dance-gallery-section { height: 78vh !important; max-height: 78vh !important; }
        .carousel-dashboard-viewer { height: 48vh !important; border-radius: 8px; }
    }
</style>

<section class="dance-stage dance-gallery-section">
    <div class="gallery-title">
        <h2>Fotos de {{ dance.name }}</h2>
    </div>

    <div class="carousel-dashboard-viewer">
        <div class="carousel-track-animation">
            {% if 'joropo' in dance.slug or 'venezuela' in dance.slug %}
                <figure class="carousel-slide-item">
                    <img src="{% static 'danceapp/images/Joropo1.svg' %}" alt="Pareja bailando Joropo 1">
                </figure>
                <figure class="carousel-slide-item">
                    <img src="{% static 'danceapp/images/Joropo2.svg' %}" alt="Pareja bailando Joropo 2">
                </figure>
                <figure class="carousel-slide-item">
                    <img src="{% static 'danceapp/images/Joropo3.svg' %}" alt="Pareja bailando Joropo 3">
                </figure>
                <figure class="carousel-slide-item">
                    <img src="{% static 'danceapp/images/Joropo4.svg' %}" alt="Pareja bailando Joropo 4">
                </figure>
            {% else %}
                {% for image in dance.collage_images %}
                    <figure class="carousel-slide-item">
                        <img src="{% static image %}" alt="Imagen de {{ dance.name }} {{ forloop.counter }}">
                    </figure>
                {% endfor %}
            {% endif %}
        </div>
    </div>

    <div class="page-actions-dashboard">
        <a id="btn-volver" class="button secondary" href="{% url 'dance_stage' dance.slug 'principal' %}">Volver</a>
        <a id="btn-siguiente" class="button primary" href="{% url 'dance_stage' dance.slug 'video' %}">Siguiente</a>
    </div>
</section>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // --- SISTEMA DE VOZ IA PARA NAVEGACIÓN DE GALERÍA (MANTENIDO INTACTO) ---
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (window.SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const resultIndex = event.resultIndex;
                const command = event.results[resultIndex][0].transcript.toLowerCase().trim();
                console.log("Palabra capturada en Galería:", command);

                if (command.includes("volver")) {
                    const btnVolver = document.getElementById("btn-volver");
                    if (btnVolver) btnVolver.click();
                } 
                else if (command.includes("siguiente")) {
                    const btnSiguiente = document.getElementById("btn-siguiente");
                    if (btnSiguiente) btnSiguiente.click();
                }
            };

            recognition.onend = function() {
                setTimeout(() => {
                    try {
                        recognition.start();
                    } catch(e) {
                        console.log("Reinicio de micrófono amortiguado en Galería.");
                    }
                }, 300);
            };

            recognition.start();
            console.log("IA auditiva activa en Galería. Escuchando: 'Volver' o 'Siguiente'.");
        }
    });
</script>
{% endblock %}
