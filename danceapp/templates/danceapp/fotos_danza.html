{% extends 'danceapp/base.html' %}
{% load static %}

{% block content %}
<style>
    /* CONEXIÓN ULTRA ESTRICTA SINGLE VIEWPORT
       Convertimos toda la sección en un contenedor Flex vertical de tamaño fijo e inamovible
    */
    .dance-gallery-section {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: space-between !important; /* Distribuye el espacio exacto entre Título, Carrusel y Botones */
        width: 100% !important;
        height: 75vh !important; /* Altura máxima ideal para absorber menús superiores de base.html sin desbordar */
        max-height: 75vh !important;
        margin: 0 auto !important;
        padding: 10px 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important; /* Bloquea cualquier intento de scroll accidental */
    }

    /* Título optimizado para Dashboard */
    .gallery-title {
        width: 100% !important;
        text-align: center !important;
        margin: 0 !important;
    }
    .gallery-title h2 {
        text-transform: uppercase; 
        font-weight: 700; 
        margin: 0;
        font-size: 1.6rem !important;
    }

    /* Visor del Carrusel calibrado para Single Viewport */
    .carousel-dashboard-viewer {
        width: 100%;
        max-width: 850px; /* Ancho idóneo para conservar la proporción visual en pantallas horizontales */
        height: 52vh !important; /* Asignación exacta del espacio mayoritario de pantalla */
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
        background: #f8fafc;
    }

    /* Cinta interna del carrusel */
    .carousel-track-animation {
        display: flex;
        width: 400%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        animation: dashboardSlider 16s infinite ease-in-out;
    }

    .carousel-slide-item {
        width: 25%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    .carousel-slide-item img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* Renderiza la foto completa de forma impecable */
        display: block;
        background-color: #f1f5f9;
    }

    /* Botonera integrada al flujo del Dashboard de Impacto Directo */
    .page-actions-dashboard {
        display: flex !important;
        justify-content: center !important;
        gap: 16px !important;
        width: 100% !important;
        margin-top: 10px !important;
    }

    /* Animación cíclica CSS para las 4 imágenes */
    @keyframes dashboardSlider {
        0%, 20% { transform: translateX(0%); }
        22.5% { transform: translateX(-25%); }
        25%, 45% { transform: translateX(-25%); }
        47.5% { transform: translateX(-50%); }
        50%, 70% { transform: translateX(-50%); }
        72.5% { transform: translateX(-75%); }
        75%, 95% { transform: translateX(-75%); }
        100% { transform: translateX(0%); }
    }

    /* Ajustes dinámicos para pantallas compactas */
    @media (max-height: 650px) or (max-width: 600px) {
        .gallery-title h2 { font-size: 1.3rem !important; }
        .dance-gallery-section { height: 78vh !important; max-height: 78vh !important; }
        .carousel-dashboard-viewer { height: 48vh !important; border-radius: 8px; }
    }
</style>

<section class="dance-stage dance-gallery-section">
    <div class="gallery-title">
        <h2>Fotos de {{ dance.name }}</h2>
    </div>

    <div class="carousel-dashboard-viewer">
        <div class="carousel-track-animation">
            {% if 'joropo' in dance.slug or 'venezuela' in dance.slug %}
                <figure class="carousel-slide-item">
                    <img src="{% static 'danceapp/images/Joropo1.svg' %}" alt="Pareja bailando Joropo 1">
                </figure>
                <figure class="carousel-slide-item">
                    <img src="{% static 'danceapp/images/Joropo2.svg' %}" alt="Pareja bailando Joropo 2">
                </figure>
                <figure class="carousel-slide-item">
                    <img src="{% static 'danceapp/images/Joropo3.svg' %}" alt="Pareja bailando Joropo 3">
                </figure>
                <figure class="carousel-slide-item">
                    <img src="{% static 'danceapp/images/Joropo4.svg' %}" alt="Pareja bailando Joropo 4">
                </figure>
            {% else %}
                {% for image in dance.collage_images %}
                    <figure class="carousel-slide-item">
                        <img src="{% static image %}" alt="Imagen de {{ dance.name }} {{ forloop.counter }}">
                    </figure>
                {% endfor %}
            {% endif %}
        </div>
    </div>

    <div class="page-actions-dashboard">
        <a id="btn-volver" class="button secondary" href="{% url 'dance_stage' dance.slug 'principal' %}">Volver</a>
        <a id="btn-siguiente" class="button primary" href="{% url 'dance_stage' dance.slug 'video' %}">Siguiente</a>
    </div>
</section>

<script>
    (function() {
        'use strict';
        
        // Obtener referencias a los botones
        const btnVolver = document.getElementById('btn-volver');
        const btnSiguiente = document.getElementById('btn-siguiente');
        
        // Variable para controlar si ya configuramos el interceptor
        if (window.galleryVoiceInterceptorActive) {
            return; // Ya está configurado
        }
        
        window.galleryVoiceInterceptorActive = true;
        
        // Función para mostrar feedback en el status
        function showVoiceFeedback(message, isError = false, isTemp = false) {
            const statusDiv = document.getElementById('voice-status');
            if (statusDiv) {
                const originalText = statusDiv.textContent;
                statusDiv.textContent = message;
                if (isError) {
                    statusDiv.style.backgroundColor = '#f44336';
                } else {
                    statusDiv.style.backgroundColor = '#ff9800';
                }
                
                if (isTemp) {
                    setTimeout(() => {
                        if (statusDiv && statusDiv.textContent === message) {
                            statusDiv.textContent = originalText;
                            statusDiv.style.backgroundColor = '';
                        }
                    }, 2000);
                }
            }
        }
        
        // Sobrescribir temporalmente el comportamiento de navegación por voz
        // Guardar la función original de voice.js si existe
        const originalBuildNavigationUrl = window.buildNavigationUrl;
        const originalParseCommand = window.parseCommand;
        
        // Interceptar comandos específicos para la galería
        window.processGalleryCommand = function(command) {
            console.log("Galería procesando comando:", command);
            
            if (command.includes('volver') || command.includes('atrás') || command.includes('regresar')) {
                showVoiceFeedback('🎤 Comando "Volver" detectado', false, true);
                if (btnVolver) {
                    btnVolver.style.transform = 'scale(0.95)';
                    setTimeout(() => { if(btnVolver) btnVolver.style.transform = ''; }, 200);
                    setTimeout(() => { btnVolver.click(); }, 100);
                }
                return true;
            }
            else if (command.includes('siguiente') || command.includes('adelante') || command.includes('continuar')) {
                showVoiceFeedback('🎤 Comando "Siguiente" detectado', false, true);
                if (btnSiguiente) {
                    btnSiguiente.style.transform = 'scale(0.95)';
                    setTimeout(() => { if(btnSiguiente) btnSiguiente.style.transform = ''; }, 200);
                    setTimeout(() => { btnSiguiente.click(); }, 100);
                }
                return true;
            }
            return false;
        };
        
        // Interceptar el evento de resultado del reconocimiento global
        // Escuchar eventos personalizados o sobrescribir el handler
        
        // Método 1: Crear un MutationObserver para detectar cambios en el DOM y
        // agregar un listener al sistema de voz existente
        
        // Método 2: Sobrescribir la función de parseCommand temporalmente
        if (typeof window.parseCommand === 'function') {
            const originalParseCommandFn = window.parseCommand;
            window.parseCommand = function(text) {
                // Primero intentar procesar en galería
                if (window.processGalleryCommand && window.processGalleryCommand(text)) {
                    return null; // Ya se procesó, no hacer nada más
                }
                // Si no, usar la original
                return originalParseCommandFn(text);
            };
            console.log("Galería: Interceptor de comandos de voz activado");
        } else {
            // Si voice.js no ha cargado, esperar a que cargue
            console.log("Galería: Esperando a que cargue voice.js...");
            
            // Esperar a que se cargue el sistema de voz global
            const checkVoiceJs = setInterval(() => {
                if (typeof window.parseCommand === 'function') {
                    clearInterval(checkVoiceJs);
                    const originalParseCommandFn = window.parseCommand;
                    window.parseCommand = function(text) {
                        if (window.processGalleryCommand && window.processGalleryCommand(text)) {
                            return null;
                        }
                        return originalParseCommandFn(text);
                    };
                    console.log("Galería: Interceptor de comandos de voz activado (tardío)");
                }
            }, 100);
            
            // Timeout por si nunca carga
            setTimeout(() => {
                clearInterval(checkVoiceJs);
            }, 5000);
        }
        
        // También interceptar el evento onresult de recognition si es posible
        // Esto es más agresivo pero funciona como respaldo
        setTimeout(() => {
            // Buscar la instancia de recognition en window
            if (window.activeRecognition) {
                console.log("Galería: Instancia de reconocimiento encontrada");
                const originalOnResult = window.activeRecognition.onresult;
                if (originalOnResult) {
                    window.activeRecognition.onresult = function(event) {
                        const resultIndex = event.resultIndex;
                        const transcript = event.results[resultIndex][0].transcript.toLowerCase().trim();
                        
                        // Procesar en galería primero
                        if (window.processGalleryCommand && window.processGalleryCommand(transcript)) {
                            return; // Ya se manejó
                        }
                        
                        // Si no, llamar al original
                        if (originalOnResult) {
                            originalOnResult(event);
                        }
                    };
                    console.log("Galería: Handler de resultados interceptado");
                }
            }
        }, 500);
        
        // Feedback visual de que la galería está lista para comandos de voz
        const statusDiv = document.getElementById('voice-status');
        if (statusDiv) {
            const updateStatus = () => {
                if (statusDiv.textContent.includes('Escuchando') || statusDiv.textContent.includes('Reconocimiento')) {
                    // Añadir indicación de que los comandos de galería están activos
                    if (!statusDiv.textContent.includes('(Volver/Siguiente)')) {
                        statusDiv.textContent = statusDiv.textContent + ' (Di "Volver" o "Siguiente")';
                    }
                }
            };
            setTimeout(updateStatus, 1000);
        }
        
        console.log("Galería: Sistema de voz listo - Comandos: Volver, Siguiente");
    })();
</script>
{% endblock %}
